<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 · Page Not Found</title>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600;700&family=Inter:wght@400;500&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap-icons/1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" th:href="@{/css/theme.css}">
</head>
<body class="eams-error-body">
<div class="eams-error-card">
    <div class="eams-error-code eams-mono" style="color: var(--accent-warning);">404</div>
    <i class="bi bi-signpost-split eams-error-icon" style="color: var(--accent-warning);"></i>
    <h2>Page Not Found</h2>
    <p>The page you're looking for doesn't exist or may have been moved.</p>
    <a href="/dashboard" class="btn eams-btn eams-btn--primary"><i class="bi bi-house"></i> Back to Dashboard</a>
</div>
</body>
</html>
