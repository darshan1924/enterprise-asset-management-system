<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<body>
<div th:replace="~{layout/base :: layout('Assign Asset', ~{::section}, ~{})}">
    <section>

        <div class="eams-page-header">
            <div>
                <h2 class="mb-1">Assign Asset</h2>
                <p class="mb-0" style="color: var(--text-secondary);">Only available assets and active employees are listed</p>
            </div>
            <a th:href="@{/allocations}" class="btn eams-btn eams-btn--ghost"><i class="bi bi-arrow-left"></i> Back to list</a>
        </div>

        <div class="eams-card" style="max-width: 680px;">
            <form th:action="${isEdit} ? @{/allocations/{id}(id=${allocationId})} : @{/allocations}"
                      th:object="${assetAllocationRequestDto}" method="post" class="eams-validate">
                <div class="mb-3">
                    <label class="eams-label">Asset</label>
                    <select class="form-select eams-input" th:field="*{assetId}">
                        <option value="">Select an available asset…</option>
                        <option th:each="asset : ${availableAssets}" th:value="${asset.id}"
                                th:text="${asset.assetCode + ' — ' + asset.assetName}">Asset</option>
                    </select>
                    <div class="eams-error" th:if="${#fields.hasErrors('assetId')}" th:errors="*{assetId}"></div>
                </div>

                <div class="mb-3">
                    <label class="eams-label">Employee</label>
                    <select class="form-select eams-input" th:field="*{employeeId}">
                        <option value="">Select an employee…</option>
                        <option th:each="emp : ${employees}" th:value="${emp.id}"
                                th:text="${emp.employeeCode + ' — ' + emp.firstName + ' ' + emp.lastName}">Employee</option>
                    </select>
                    <div class="eams-error" th:if="${#fields.hasErrors('employeeId')}" th:errors="*{employeeId}"></div>
                </div>

                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label class="eams-label">Allocation Date</label>
                        <input type="date" class="form-control eams-input" th:field="*{allocationDate}">
                        <div class="eams-error" th:if="${#fields.hasErrors('allocationDate')}" th:errors="*{allocationDate}"></div>
                    </div>
                    <div class="col-md-6 mb-3">
                        <label class="eams-label">Expected Return Date (optional)</label>
                        <input type="date" class="form-control eams-input" th:field="*{expectedReturnDate}">
                        <div class="eams-error" th:if="${#fields.hasErrors('expectedReturnDate')}" th:errors="*{expectedReturnDate}"></div>
                    </div>
                </div>

                <div class="mb-4">
                    <label class="eams-label">Remarks (optional)</label>
                    <textarea class="form-control eams-input" rows="2" th:field="*{remarks}" placeholder="Any notes about this assignment"></textarea>
                    <div class="eams-error" th:if="${#fields.hasErrors('remarks')}" th:errors="*{remarks}"></div>
                </div>

                <button type="submit" class="btn eams-btn eams-btn--primary">
                    <i class="bi bi-check-lg"></i> Assign Asset
                </button>
            </form>
        </div>

    </section>
</div>
</body>
</html>
