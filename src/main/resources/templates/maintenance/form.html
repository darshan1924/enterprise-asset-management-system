<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<body>
<div th:replace="~{layout/base :: layout('Raise Maintenance Ticket', ~{::section}, ~{})}">
    <section>

        <div class="eams-page-header">
            <div>
                <h2 class="mb-1">Raise Maintenance Ticket</h2>
                <p class="mb-0" style="color: var(--text-secondary);">Only assets currently available are listed</p>
            </div>
            <a th:href="@{/maintenance}" class="btn eams-btn eams-btn--ghost"><i class="bi bi-arrow-left"></i> Back to list</a>
        </div>

        <div class="eams-card" style="max-width: 700px;">
            <form th:action="@{/maintenance}" th:object="${maintenanceRequestDto}" method="post">

                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label class="eams-label">Asset</label>
                        <select class="form-select eams-input" th:field="*{assetId}">
                            <option value="">Select asset…</option>
                            <option th:each="asset : ${assets}" th:value="${asset.id}"
                                    th:text="${asset.assetCode + ' — ' + asset.assetName}">Asset</option>
                        </select>
                        <div class="eams-error" th:if="${#fields.hasErrors('assetId')}" th:errors="*{assetId}"></div>
                    </div>
                    <div class="col-md-6 mb-3">
                        <label class="eams-label">Vendor (optional)</label>
                        <select class="form-select eams-input" th:field="*{vendorId}">
                            <option value="">Select vendor…</option>
                            <option th:each="v : ${vendors}" th:value="${v.id}" th:text="${v.vendorName}">Vendor</option>
                        </select>
                        <div class="eams-error" th:if="${#fields.hasErrors('vendorId')}" th:errors="*{vendorId}"></div>
                    </div>
                </div>

                <div class="mb-3">
                    <label class="eams-label">Title</label>
                    <input type="text" class="form-control eams-input" th:field="*{title}" placeholder="Brief title summarizing the issue...">
                    <div class="eams-error" th:if="${#fields.hasErrors('title')}" th:errors="*{title}"></div>
                </div>

                <div class="mb-3">
                    <label class="eams-label">Issue Description</label>
                    <textarea class="form-control eams-input" rows="3" th:field="*{issueDescription}" placeholder="Describe the problem in detail…"></textarea>
                    <div class="eams-error" th:if="${#fields.hasErrors('issueDescription')}" th:errors="*{issueDescription}"></div>
                </div>

                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label class="eams-label">Reported Date</label>
                        <input type="date" class="form-control eams-input" th:field="*{reportedDate}">
                        <div class="eams-error" th:if="${#fields.hasErrors('reportedDate')}" th:errors="*{reportedDate}"></div>
                    </div>
                    <div class="col-md-6 mb-3">
                        <label class="eams-label">Expected Completion (optional)</label>
                        <input type="date" class="form-control eams-input" th:field="*{expectedCompletionDate}">
                        <div class="eams-error" th:if="${#fields.hasErrors('expectedCompletionDate')}" th:errors="*{expectedCompletionDate}"></div>
                    </div>
                </div>

                <div class="mb-3">
                    <label class="eams-label">Estimated Cost (optional, ₹)</label>
                    <input type="number" step="0.01" class="form-control eams-input eams-mono" th:field="*{maintenanceCost}" placeholder="e.g. 2500">
                    <div class="eams-error" th:if="${#fields.hasErrors('maintenanceCost')}" th:errors="*{maintenanceCost}"></div>
                </div>

                <div class="mb-4">
                    <label class="eams-label">Remarks (optional)</label>
                    <textarea class="form-control eams-input" rows="2" th:field="*{remarks}"></textarea>
                    <div class="eams-error" th:if="${#fields.hasErrors('remarks')}" th:errors="*{remarks}"></div>
                </div>

                <button type="submit" class="btn eams-btn eams-btn--primary">
                    <i class="bi bi-check-lg"></i> Raise Ticket
                </button>
            </form>
        </div>

    </section>
</div>
</body>
</html>
