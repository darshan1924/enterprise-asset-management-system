<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<body>
<div th:replace="~{layout/base :: layout('Assets', ~{::section}, ~{})}"><section>

        <div class="eams-page-header">
            <div>
                <h2 class="mb-1">Asset Inventory</h2>
                <p class="mb-0" style="color: var(--text-secondary);">Every physical asset owned by the organization</p>
            </div>
            <a th:href="@{/assets/new}" class="btn eams-btn eams-btn--primary" sec:authorize="hasAnyRole('ADMIN','ASSET_MANAGER')"><i class="bi bi-plus-lg"></i> New Asset</a>
        </div>

        <div class="eams-card mb-3">
            <form th:action="@{/assets}" method="get" class="row g-2 align-items-end">
                <div class="col-md-4">
                    <label class="eams-label">Keyword</label>
                    <input type="text" name="keyword" th:value="${keyword}" class="form-control eams-input" placeholder="Code, name, location…">
                </div>
                <div class="col-md-3">
                    <label class="eams-label">Category</label>
                    <select name="categoryId" class="form-select eams-input">
                        <option value="">All categories</option>
                        <option th:each="cat : ${categories}" th:value="${cat.id}" th:text="${cat.categoryName}"
                                th:selected="${categoryId != null and categoryId == cat.id}">Category</option>
                    </select>
                </div>
                <div class="col-md-2">
                    <label class="eams-label">Status</label>
                    <select name="status" class="form-select eams-input">
                        <option value="">All statuses</option>
                        <option th:each="st : ${statuses}" th:value="${st}" th:text="${st}"
                                th:selected="${status != null and status == st}">Status</option>
                    </select>
                </div>
                <div class="col-md-2">
                    <label class="eams-label">Vendor</label>
                    <select name="vendorId" class="form-select eams-input">
                        <option value="">All vendors</option>
                        <option th:each="v : ${vendors}" th:value="${v.id}" th:text="${v.vendorName}"
                                th:selected="${vendorId != null and vendorId == v.id}">Vendor</option>
                    </select>
                </div>
                <div class="col-md-1">
                    <button type="submit" class="btn eams-btn eams-btn--primary w-100"><i class="bi bi-funnel"></i></button>
                </div>
            </form>
        </div>

        <div class="eams-card">
            <div class="table-responsive">
                <table class="table eams-table align-middle mb-0">
                    <thead>
                    <tr>
                        <th>Code</th>
                        <th data-sort-field="assetName">Name</th>
                        <th>Category</th>
                        <th>Status</th>
                        <th>Current Holder</th>
                        <th>Purchase Cost</th>
                        <th class="text-end">Actions</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="asset : ${assets.content}">
                        <td class="eams-mono"><a th:href="@{/assets/{id}(id=${asset.id})}" th:text="${asset.assetCode}">AST-001</a></td>
                        <td th:text="${asset.assetName}">Asset</td>
                        <td th:text="${asset.categoryName}">Category</td>
                        <td>
                            <span th:switch="${asset.status != null ? asset.status.name() : ''}">
                                <span th:case="'AVAILABLE'" class="eams-badge eams-badge--success">AVAILABLE</span>
                                <span th:case="'ALLOCATED'" class="eams-badge eams-badge--info">ALLOCATED</span>
                                <span th:case="'UNDER_MAINTENANCE'" class="eams-badge eams-badge--warning">MAINTENANCE</span>
                                <span th:case="*" class="eams-badge eams-badge--danger" th:text="${asset.status}">RETIRED</span>
                            </span>
                        </td>
                        <td th:text="${asset.currentHolderName} ?: '—'">Holder</td>
                        <td class="eams-mono" th:text="${'₹' + asset.purchaseCost}">₹0</td>
                        <td class="text-end">
                            <a th:href="@{/assets/{id}(id=${asset.id})}" class="eams-icon-btn"><i class="bi bi-eye"></i></a>
                            <span sec:authorize="hasAnyRole('ADMIN','ASSET_MANAGER')">
                                <a th:href="@{/assets/{id}/edit(id=${asset.id})}" class="eams-icon-btn"><i class="bi bi-pencil"></i></a>
                                <form th:action="@{/assets/{id}/delete(id=${asset.id})}" method="post" class="d-inline"
                                      data-confirm="Delete this asset? This cannot be undone.">
                                    <button type="submit" class="eams-icon-btn eams-icon-btn--danger"><i class="bi bi-trash"></i></button>
                                </form>
                            </span>
                        </td>
                    </tr>
                    <tr th:if="${assets.content.isEmpty()}">
                        <td colspan="7" class="text-center py-4" style="color: var(--text-muted);">No assets found.</td>
                    </tr>
                    </tbody>
                </table>
            </div>

            <div th:replace="~{fragments/pagination :: pagination(${assets}, '/assets')}"></div>
        </div>

    </section>
</div>
</body>
</html>
