<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<body>
<div th:replace="~{layout/base :: layout('Change Password', ~{::section}, ~{})}">
    <section>

        <div class="eams-page-header">
            <div>
                <h2 class="mb-1">Change Password</h2>
                <p class="mb-0" style="color: var(--text-secondary);">Update your account password</p>
            </div>
        </div>

        <div class="eams-card" style="max-width: 480px;">

            <div th:if="${errorMessage}" class="eams-alert" style="background: var(--accent-danger-dim); color: var(--accent-danger); border-color: var(--accent-danger);" th:text="${errorMessage}"></div>

            <form th:action="@{/profile/change-password}" method="post">

                <div class="mb-3">
                    <label class="eams-label">Current Password</label>
                    <input type="password" name="currentPassword" class="form-control eams-input" required>
                </div>

                <div class="mb-3">
                    <label class="eams-label">New Password</label>
                    <input type="password" name="newPassword" class="form-control eams-input" minlength="8" required>
                </div>

                <div class="mb-4">
                    <label class="eams-label">Confirm New Password</label>
                    <input type="password" name="confirmPassword" class="form-control eams-input" minlength="8" required>
                </div>

                <button type="submit" class="btn eams-btn eams-btn--primary">
                    <i class="bi bi-check-lg"></i> Update Password
                </button>
            </form>
        </div>

    </section>
</div>
</body>
</html>
