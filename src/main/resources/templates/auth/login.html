<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Enterprise Asset Management System</title>

    <!-- Default Favicon to fix tab icon issues -->
    <link rel="icon" type="image/x-icon" th:href="@{/favicon.ico}" href="/favicon.ico">

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet">

    <!-- Bootstrap Icons (CDN with backup unpkg fallback) -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <!-- Theme CSS -->
    <link rel="stylesheet" th:href="@{/css/theme.css}" href="/css/theme.css">
</head>

<body class="eams-error-body eams-login-page">
<div class="eams-login-bg"></div>
<div class="eams-login-bg eams-login-bg--2"></div>

<div class="eams-login-card">
    <!-- Brand Header -->
    <div class="eams-brand justify-content-center" style="border: none; padding: 0 0 18px;">
        <div class="eams-brand-mark">
            <i class="bi bi-bounding-box-circles"></i>
        </div>
        <div class="eams-brand-text">
            EAMS
            <small>Asset Management</small>
        </div>
    </div>

    <!-- Login Copy -->
    <div class="eams-login-copy">
        <h2>Welcome back</h2>
        <p>Sign in to manage assets, vendors, and maintenance with confidence.</p>
    </div>

    <!-- Conditional Alerts (Only rendered when attributes exist) -->
    <div th:if="${errorMessage != null}" class="eams-alert eams-alert--danger" th:text="${errorMessage}">
        Invalid username or password.
    </div>
    <div th:if="${param.logout != null or logoutMessage != null}" class="eams-alert eams-alert--success" th:text="${logoutMessage ?: 'You have been logged out successfully.'}">
        Logged out successfully.
    </div>

    <!-- Login Form -->
    <form th:action="@{/login}" method="post" class="eams-login-form">
        <!-- CSRF Token protection -->
        <input type="hidden" th:if="${_csrf != null}" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

        <div class="mb-3">
            <label class="eams-label" for="username">Username</label>
            <div class="eams-input-wrap" style="position: relative;">
                <i class="bi bi-person" style="position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: #6c757d; z-index: 5;"></i>
                <input type="text" id="username" name="username" class="form-control eams-input eams-input--icon"
                       style="padding-left: 36px;" placeholder="e.g. admin" required autofocus autocomplete="username">
            </div>
        </div>

        <div class="mb-4">
            <label class="eams-label" for="password">Password</label>
            <div class="eams-input-wrap" style="position: relative;">
                <i class="bi bi-lock" style="position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: #6c757d; z-index: 5;"></i>
                <input type="password" id="password" name="password" class="form-control eams-input eams-input--icon"
                       style="padding-left: 36px;" placeholder="••••••••" required autocomplete="current-password">
            </div>
        </div>

        <button type="submit" class="btn eams-btn eams-btn--primary w-100 eams-login-btn">
            <i class="bi bi-box-arrow-in-right me-1"></i> Sign In
        </button>
    </form>

    <div class="eams-login-meta" style="display: flex; justify-content: space-between; margin-top: 24px; font-size: 13px; color: #6c757d;">
        <span><i class="bi bi-shield-lock me-1"></i> Secure access</span>
        <span><i class="bi bi-lightning-charge me-1"></i> Fast workflow</span>
    </div>
</div>
</body>
</html>
